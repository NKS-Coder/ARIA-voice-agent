name = "ariaproxy"
main = "worker/aria-worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WORKER_HOST = "ariaproxy.nihharksonee.workers.dev"

# ── Rate limiting ──────────────────────────────────────────────
# Cloudflare's native rate limiter. This MUST be used instead of an in-memory
# counter: Workers spread requests from one client across many isolates, so a
# module-level Map never accumulates (verified in production — 25/25 requests
# passed a "15 per minute" in-memory limit). These bindings aggregate per colo.
# namespace_id is an arbitrary but STABLE id per limiter; changing it resets
# the counters. No dashboard setup needed — wrangler provisions them on deploy.

[[unsafe.bindings]]
name = "TTS_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[[unsafe.bindings]]
name = "CHAT_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "API_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
